name: lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned validators
        run: python3 -m pip install --disable-pip-version-check yamllint==1.38.0
      - name: Lint YAML front-matter in detections
        run: |
          set -e
          for f in detections/*.md; do
            [ "$(basename "$f")" = "_template.md" ] && continue
            python3 scripts/extract_frontmatter.py "$f" | yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable}}" -
          done

  detection-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned schema dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate detection schema
        run: python3 scripts/validate_detections.py
      - name: Validate portfolio source-of-truth consistency
        run: python3 scripts/validate_portfolio_consistency.py

  conf-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate .conf stanza syntax
        run: python3 scripts/validate_conf.py

  static-site-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate portfolio security and integrity
        run: python3 scripts/validate_site.py
