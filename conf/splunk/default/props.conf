# Search-time field extractions and CIM normalization for XML-rendered Windows data.
# These settings are deliberately packaged in default/ so local customer tuning
# survives app upgrades.

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
EXTRACT-event_id = <EventID>(?<EventID>\d+)</EventID>
EXTRACT-record_id = <EventRecordID>(?<EventRecordID>\d+)</EventRecordID>
EXTRACT-computer = <Computer>(?<Computer>[^<]+)</Computer>
EXTRACT-rule_name = <Data Name='RuleName'>(?<RuleName>[^<]*)</Data>
EXTRACT-utc_time = <Data Name='UtcTime'>(?<UtcTime>[^<]*)</Data>
EXTRACT-process_guid = <Data Name='ProcessGuid'>(?<ProcessGuid>[^<]*)</Data>
EXTRACT-process_id = <Data Name='ProcessId'>(?<ProcessId>[^<]*)</Data>
EXTRACT-image = <Data Name='Image'>(?<Image>[^<]*)</Data>
EXTRACT-original_file_name = <Data Name='OriginalFileName'>(?<OriginalFileName>[^<]*)</Data>
EXTRACT-cmdline = <Data Name='CommandLine'>(?<CommandLine>[^<]*)</Data>
EXTRACT-current_dir = <Data Name='CurrentDirectory'>(?<CurrentDirectory>[^<]*)</Data>
EXTRACT-user = <Data Name='User'>(?<User>[^<]*)</Data>
EXTRACT-logon_guid = <Data Name='LogonGuid'>(?<LogonGuid>[^<]*)</Data>
EXTRACT-logon_id = <Data Name='LogonId'>(?<LogonId>[^<]*)</Data>
EXTRACT-terminal_session = <Data Name='TerminalSessionId'>(?<TerminalSessionId>[^<]*)</Data>
EXTRACT-integrity = <Data Name='IntegrityLevel'>(?<IntegrityLevel>[^<]*)</Data>
EXTRACT-hashes = <Data Name='Hashes'>(?<Hashes>[^<]*)</Data>
EXTRACT-parent_process_guid = <Data Name='ParentProcessGuid'>(?<ParentProcessGuid>[^<]*)</Data>
EXTRACT-parent_process_id = <Data Name='ParentProcessId'>(?<ParentProcessId>[^<]*)</Data>
EXTRACT-parent_image = <Data Name='ParentImage'>(?<ParentImage>[^<]*)</Data>
EXTRACT-parent_cmdline = <Data Name='ParentCommandLine'>(?<ParentCommandLine>[^<]*)</Data>
EXTRACT-parent_user = <Data Name='ParentUser'>(?<ParentUser>[^<]*)</Data>
EXTRACT-target_filename = <Data Name='TargetFilename'>(?<TargetFilename>[^<]*)</Data>
EXTRACT-image_loaded = <Data Name='ImageLoaded'>(?<ImageLoaded>[^<]*)</Data>
EXTRACT-signed = <Data Name='Signed'>(?<Signed>[^<]*)</Data>
EXTRACT-signature = <Data Name='Signature'>(?<Signature>[^<]*)</Data>
EXTRACT-signature_status = <Data Name='SignatureStatus'>(?<SignatureStatus>[^<]*)</Data>
EXTRACT-source_ip = <Data Name='SourceIp'>(?<SourceIp>[^<]*)</Data>
EXTRACT-source_hostname = <Data Name='SourceHostname'>(?<SourceHostname>[^<]*)</Data>
EXTRACT-source_port = <Data Name='SourcePort'>(?<SourcePort>[^<]*)</Data>
EXTRACT-dest_ip = <Data Name='DestinationIp'>(?<DestinationIp>[^<]*)</Data>
EXTRACT-dest_hostname = <Data Name='DestinationHostname'>(?<DestinationHostname>[^<]*)</Data>
EXTRACT-dest_port = <Data Name='DestinationPort'>(?<DestinationPort>[^<]*)</Data>
EXTRACT-protocol = <Data Name='Protocol'>(?<Protocol>[^<]*)</Data>
EXTRACT-query_name = <Data Name='QueryName'>(?<QueryName>[^<]*)</Data>
EXTRACT-query_status = <Data Name='QueryStatus'>(?<QueryStatus>[^<]*)</Data>
EXTRACT-query_results = <Data Name='QueryResults'>(?<QueryResults>[^<]*)</Data>
EXTRACT-target_object = <Data Name='TargetObject'>(?<TargetObject>[^<]*)</Data>
EXTRACT-details_reg = <Data Name='Details'>(?<Details>[^<]*)</Data>
EXTRACT-event_type_reg = <Data Name='EventType'>(?<RegistryEventType>[^<]*)</Data>
EXTRACT-source_process_guid = <Data Name='SourceProcessGUID'>(?<SourceProcessGUID>[^<]*)</Data>
EXTRACT-source_process_id = <Data Name='SourceProcessId'>(?<SourceProcessId>[^<]*)</Data>
EXTRACT-source_image = <Data Name='SourceImage'>(?<SourceImage>[^<]*)</Data>
EXTRACT-source_command_line = <Data Name='SourceCommandLine'>(?<SourceCommandLine>[^<]*)</Data>
EXTRACT-source_user = <Data Name='SourceUser'>(?<SourceUser>[^<]*)</Data>
EXTRACT-target_process_guid = <Data Name='TargetProcessGUID'>(?<TargetProcessGUID>[^<]*)</Data>
EXTRACT-target_process_id = <Data Name='TargetProcessId'>(?<TargetProcessId>[^<]*)</Data>
EXTRACT-target_image = <Data Name='TargetImage'>(?<TargetImage>[^<]*)</Data>
EXTRACT-granted_access = <Data Name='GrantedAccess'>(?<GrantedAccess>[^<]*)</Data>
EXTRACT-call_trace = <Data Name='CallTrace'>(?<CallTrace>[^<]*)</Data>
FIELDALIAS-eventcode_alias = EventID AS EventCode
FIELDALIAS-host_to_dest = host AS dest
FIELDALIAS-image_to_process_path = Image AS process_path
FIELDALIAS-processid_to_process_id = ProcessId AS process_id
FIELDALIAS-processguid_to_process_guid = ProcessGuid AS process_guid
FIELDALIAS-parent_image_to_parent_process = ParentImage AS parent_process
FIELDALIAS-parent_image_to_parent_process_path = ParentImage AS parent_process_path
FIELDALIAS-parent_pid = ParentProcessId AS parent_process_id
FIELDALIAS-parent_guid = ParentProcessGuid AS parent_process_guid
FIELDALIAS-parent_cmdline = ParentCommandLine AS parent_process_cmdline
FIELDALIAS-cmdline_to_process_cmdline = CommandLine AS process_cmdline
FIELDALIAS-user_to_user = User AS user
FIELDALIAS-sourceip = SourceIp AS src_ip
FIELDALIAS-sourcehost = SourceHostname AS src
FIELDALIAS-sourceport = SourcePort AS src_port
FIELDALIAS-destip = DestinationIp AS dest_ip
FIELDALIAS-desthost = DestinationHostname AS dest_host
FIELDALIAS-destport = DestinationPort AS dest_port
FIELDALIAS-targetfilename = TargetFilename AS file_path
FIELDALIAS-imageloaded = ImageLoaded AS module_path
FIELDALIAS-querydomain = QueryName AS query
FIELDALIAS-queryresult = QueryResults AS answer
FIELDALIAS-hashes_to_process_hash = Hashes AS process_hash
EVAL-process = Image
EVAL-process_name = mvindex(split(Image, "\\"), -1)
EVAL-parent_process_name = mvindex(split(ParentImage, "\\"), -1)
EVAL-file_name = mvindex(split(TargetFilename, "\\"), -1)
EVAL-module_name = mvindex(split(ImageLoaded, "\\"), -1)
EVAL-vendor_product = "Microsoft Sysmon"
EVAL-action = case(EventID==1,"created", EventID==5,"terminated", EventID==3,"connected", EventID==11,"created", EventID==12,"created", EventID==13,"modified", EventID==14,"renamed", EventID==23,"deleted", EventID==26,"deleted")

[XmlWinEventLog:Security]
EXTRACT-sec_event_id = <EventID>(?<EventID>\d+)</EventID>
EXTRACT-sec_target_user = <Data Name='TargetUserName'>(?<TargetUserName>[^<]*)</Data>
EXTRACT-sec_target_domain = <Data Name='TargetDomainName'>(?<TargetDomainName>[^<]*)</Data>
EXTRACT-sec_subject_user = <Data Name='SubjectUserName'>(?<SubjectUserName>[^<]*)</Data>
EXTRACT-sec_logon_type = <Data Name='LogonType'>(?<LogonType>[^<]*)</Data>
EXTRACT-sec_workstation = <Data Name='WorkstationName'>(?<WorkstationName>[^<]*)</Data>
EXTRACT-sec_ip_address = <Data Name='IpAddress'>(?<IpAddress>[^<]*)</Data>
EXTRACT-sec_ip_port = <Data Name='IpPort'>(?<IpPort>[^<]*)</Data>
EXTRACT-sec_process_name = <Data Name='ProcessName'>(?<ProcessName>[^<]*)</Data>
EXTRACT-sec_status = <Data Name='Status'>(?<Status>[^<]*)</Data>
EXTRACT-sec_failure_reason = <Data Name='FailureReason'>(?<FailureReason>[^<]*)</Data>
EXTRACT-sec_auth_package = <Data Name='AuthenticationPackageName'>(?<AuthenticationPackageName>[^<]*)</Data>
EXTRACT-sec_logon_process = <Data Name='LogonProcessName'>(?<LogonProcessName>[^<]*)</Data>
EXTRACT-sec_ticket_options = <Data Name='TicketOptions'>(?<TicketOptions>[^<]*)</Data>
EXTRACT-sec_service_name = <Data Name='ServiceName'>(?<ServiceName>[^<]*)</Data>
FIELDALIAS-sec_eventcode_alias = EventID AS EventCode
FIELDALIAS-host_to_dest_sec = host AS dest
FIELDALIAS-targetuser_to_user = TargetUserName AS user
FIELDALIAS-srcip_secevt = IpAddress AS src_ip
FIELDALIAS-workstation = WorkstationName AS src
EVAL-vendor_product = "Microsoft Windows"
EVAL-action = case(EventID==4624,"success", EventID==4625,"failure", EventID==4720,"created", EventID==4726,"deleted", EventID==4740,"locked", EventID==4768 OR EventID==4769,"requested")

[XmlWinEventLog:Microsoft-Windows-PowerShell/Operational]
EXTRACT-ps_event_id = <EventID>(?<EventID>\d+)</EventID>
EXTRACT-ps_script_block = <Data Name='ScriptBlockText'>(?<ScriptBlockText>[\s\S]*?)</Data>
EXTRACT-ps_script_block_id = <Data Name='ScriptBlockId'>(?<ScriptBlockId>[^<]*)</Data>
EXTRACT-ps_path = <Data Name='Path'>(?<Path>[^<]*)</Data>
FIELDALIAS-ps_eventcode_alias = EventID AS EventCode
FIELDALIAS-host_to_dest_ps = host AS dest
FIELDALIAS-ps_script_to_process_cmdline = ScriptBlockText AS process_cmdline
EVAL-vendor_product = "Microsoft PowerShell"

[XmlWinEventLog:System]
EXTRACT-sys_event_id = <EventID>(?<EventID>\d+)</EventID>
FIELDALIAS-sys_eventcode_alias = EventID AS EventCode
FIELDALIAS-host_to_dest_system = host AS dest

[XmlWinEventLog:Application]
EXTRACT-app_event_id = <EventID>(?<EventID>\d+)</EventID>
FIELDALIAS-app_eventcode_alias = EventID AS EventCode
FIELDALIAS-host_to_dest_application = host AS dest
[linux:auditd]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
TIME_PREFIX = msg=audit\(
TIME_FORMAT = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 14
TZ = UTC
KV_MODE = auto_escaped
REPORT-linux-auditd-header = linux_auditd_header
REPORT-linux-auditd-result = linux_auditd_result
REPORT-linux-auditd-account = linux_auditd_account
REPORT-linux-auditd-operation = linux_auditd_operation
REPORT-linux-auditd-address = linux_auditd_address
FIELDALIAS-linux-auditd-dest = host AS dest
FIELDALIAS-linux-auditd-dvc = host AS dvc
FIELDALIAS-linux-auditd-process-path = exe AS process_path
FIELDALIAS-linux-auditd-process-id = pid AS process_id
FIELDALIAS-linux-auditd-parent-process-id = ppid AS parent_process_id
FIELDALIAS-linux-auditd-user-id = auid AS user_id
FIELDALIAS-linux-auditd-process-name = comm AS process_name
EVAL-action = case(audit_type="USER_MGMT", "created", audit_type="CONFIG_CHANGE", "modified", audit_type="SYSCALL" AND success="yes", "allowed", audit_type="SYSCALL" AND success="no", "blocked", audit_result="success" OR audit_result="1", "success", audit_result="failed" OR audit_result="0", "failure", true(), "unknown")
EVAL-app = case(audit_type="USER_AUTH", replace(exe, "^.*/", ""), true(), null())
EVAL-authentication_method = case(match(audit_operation, "(?i)^PAM"), "PAM", audit_type="USER_AUTH", "unknown", true(), null())
EVAL-change_type = case(audit_type="USER_MGMT", "AAA", audit_type="CONFIG_CHANGE", "audit", true(), null())
EVAL-command = coalesce(proctitle, exe, audit_operation, op)
EVAL-object_id = case(audit_type="USER_MGMT", coalesce(id, audit_account), audit_type="CONFIG_CHANGE", coalesce(key, audit_serial), true(), null())
EVAL-object_path = case(audit_type="USER_MGMT", "account:".audit_account, audit_type="CONFIG_CHANGE", "audit-rule:".key, true(), null())
EVAL-process = coalesce(proctitle, exe, comm)
EVAL-process_exec = coalesce(comm, replace(exe, "^.*/", ""))
EVAL-src = case(audit_address="?", null(), isnotnull(audit_address), audit_address, true(), null())
EVAL-src_user = case(audit_type="USER_MGMT" OR audit_type="CONFIG_CHANGE", tostring(auid), true(), null())
EVAL-status = case(audit_result="success" OR audit_result="1" OR success="yes", "success", audit_result="failed" OR audit_result="0" OR success="no", "failure", true(), "unknown")
EVAL-user = case(audit_type="CONFIG_CHANGE", tostring(auid), true(), coalesce(audit_account, tostring(uid), "unknown"))
EVAL-vendor_product = "Linux auditd"

[linux:journald]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
KV_MODE = json
AUTO_KV_JSON = true
EXTRACT-linux-journald-hostname = \"_HOSTNAME\"\s*:\s*\"(?<linux_journal_hostname>[^\"]+)\"
EXTRACT-linux-journald-pid = \"_PID\"\s*:\s*\"(?<linux_journal_pid>[^\"]+)\"
EXTRACT-linux-journald-uid = \"_UID\"\s*:\s*\"(?<linux_journal_uid>[^\"]+)\"
EXTRACT-linux-journald-exe = \"_EXE\"\s*:\s*\"(?<linux_journal_exe>[^\"]+)\"
FIELDALIAS-linux-journald-dest = _HOSTNAME AS dest
FIELDALIAS-linux-journald-dvc = _HOSTNAME AS dvc
FIELDALIAS-linux-journald-process-id = _PID AS process_id
FIELDALIAS-linux-journald-process-path = _EXE AS process_path
FIELDALIAS-linux-journald-process-name = _COMM AS process_name
FIELDALIAS-linux-journald-user-id = _UID AS user_id
EVAL-app = coalesce(SYSLOG_IDENTIFIER, _SYSTEMD_UNIT, _COMM)
EVAL-service = coalesce(_SYSTEMD_UNIT, UNIT)
EVAL-service_name = replace(coalesce(_SYSTEMD_UNIT, UNIT), "\\.service$", "")
EVAL-dest = coalesce(linux_journal_hostname, host)
EVAL-dvc = coalesce(linux_journal_hostname, host)
EVAL-process_id = coalesce(linux_journal_pid, _PID)
EVAL-process_path = coalesce(linux_journal_exe, _EXE)
EVAL-service_path = coalesce(linux_journal_exe, _EXE, "unknown")
EVAL-start_mode = "unknown"
EVAL-status = case(match(MESSAGE, "(?i)^(service )?(startup complete|started|starting)"), "started", match(MESSAGE, "(?i)^(service )?(shutdown complete|stopped|stopping)"), "stopped", match(MESSAGE, "(?i)(failed|failure|fatal)"), "critical", true(), "unknown")
EVAL-user = coalesce(linux_journal_uid, "unknown")
EVAL-vendor_product = "Linux systemd-journald"

[linux:rsyslog]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 20000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
TZ = UTC
KV_MODE = none
REPORT-linux-rsyslog-header = linux_rsyslog_header
REPORT-linux-rsyslog-ssh-auth = linux_rsyslog_ssh_auth
REPORT-linux-rsyslog-sudo = linux_rsyslog_sudo
REPORT-linux-rsyslog-account-change = linux_rsyslog_account_change
REPORT-linux-rsyslog-systemd-service = linux_rsyslog_systemd_service
EVAL-dest = host
EVAL-dvc = host
EVAL-action = case(linux_auth_result="Accepted", "success", linux_auth_result="Failed", "failure", app="useradd", "created", app="sudo", "modified", true(), "unknown")
EVAL-authentication_method = lower(linux_auth_method)
EVAL-change_type = case(app="useradd", "AAA", app="sudo", "endpoint", true(), null())
EVAL-command = case(app="useradd", "/usr/sbin/useradd ".linux_target_user, true(), linux_command)
EVAL-object_id = case(app="useradd", linux_target_uid, app="sudo", linux_command, true(), null())
EVAL-object_path = case(app="useradd", "account:".linux_target_user, app="sudo", linux_command, true(), null())
EVAL-service = linux_service_name
EVAL-service_name = replace(linux_service_name, "\\.service$", "")
EVAL-service_path = case(app="systemd", "/usr/lib/systemd/systemd", true(), "unknown")
EVAL-src = linux_src
EVAL-src_port = tonumber(linux_src_port)
EVAL-src_user = linux_sudo_actor
EVAL-start_mode = "unknown"
EVAL-status = case(linux_service_state="Started", "started", linux_service_state="Stopped", "stopped", linux_service_state="Failed", "critical", app="useradd" OR app="sudo", "success", true(), null())
EVAL-user = case(app="systemd" AND process_id="1", "root", true(), coalesce(linux_auth_user, linux_target_user, linux_sudo_target, "unknown"))
EVAL-vendor_product = "Linux rsyslog"
