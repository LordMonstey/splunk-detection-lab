[cim_endpoint_processes_rename]
definition = eval process=coalesce(process,Image,SourceImage), process_guid=coalesce(process_guid,ProcessGuid,SourceProcessGUID), process_id=coalesce(process_id,ProcessId,SourceProcessId), parent_process=coalesce(parent_process,ParentImage), parent_process_guid=coalesce(parent_process_guid,ParentProcessGuid), parent_process_cmdline=coalesce(parent_process_cmdline,ParentCommandLine), user=coalesce(user,User,SourceUser,SubjectUserName,"unknown"), dest=coalesce(dest,host,Computer,"unknown") | eval process_name=mvindex(split(process,"\\"),-1), parent_process_name=mvindex(split(parent_process,"\\"),-1)
iseval = 0
