[report_mco_daily_aggregate]
description = Daily MCO aggregate for the previous closed day. Stores counts and percentages only; no raw event, host, source, index, search identifier or endpoint is retained.
disabled = 0
enableSched = 1
cron_schedule = 15 1 * * *
schedule_window = auto
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
search = | makeresults | eval period_start=relative_time(now(),"-1d@d"), period_end=relative_time(now(),"@d"), generated_at=now() | fields period_start period_end generated_at | appendcols [ search index=_internal source="*scheduler.log" earliest=-1d@d latest=@d | stats count as scheduler_runs count(eval(status="success")) as scheduler_successes count(eval(status="skipped")) as scheduler_skipped ] | appendcols [ search index=_internal source="*metrics.log" group=queue earliest=-1d@d latest=@d | eval queue_fill_pct=if(max_size_kb>0,round((current_size_kb/max_size_kb)*100,2),0) | stats count as queue_samples max(queue_fill_pct) as queue_peak_fill_pct ] | appendcols [ | tstats count latest(_time) as last_event where earliest=-1d@d latest=@d (index=sysmon OR index=windows OR index=os_linux) by index sourcetype | stats sum(count) as ingestion_events count as ingestion_active_datasets count(eval(last_event<relative_time(now(),"@d")-900)) as ingestion_late_datasets ] | fillnull value=0 scheduler_runs scheduler_successes scheduler_skipped queue_samples queue_peak_fill_pct ingestion_events ingestion_active_datasets ingestion_late_datasets | eval scheduler_success_pct=if(scheduler_runs>0,round((scheduler_successes/scheduler_runs)*100,2),0) | eval metric_ids=mvappend("ingestion.events","ingestion.active_datasets","ingestion.late_datasets","scheduler.runs","scheduler.success_pct","scheduler.skipped","queues.peak_fill_pct"), metric_values=mvappend(ingestion_events,ingestion_active_datasets,ingestion_late_datasets,scheduler_runs,scheduler_success_pct,scheduler_skipped,queue_peak_fill_pct), metric_units=mvappend("count","count","count","count","percent","count","percent") | eval metric_record=mvzip(mvzip(metric_ids,metric_values,"|"),metric_units,"|") | mvexpand metric_record | rex field=metric_record "^(?<metric_id>[^|]+)\\|(?<metric_value>[^|]+)\\|(?<metric_unit>[^|]+)$" | eval report_family="mco_daily", schema_version=1, threshold_profile="mco-v1", sample_state=case(match(metric_id,"^ingestion\\."),if(ingestion_active_datasets>0,"OBSERVED","NO_DATA"),match(metric_id,"^scheduler\\."),if(scheduler_runs>0,"OBSERVED","NO_DATA"),metric_id="queues.peak_fill_pct",if(queue_samples>0,"OBSERVED","NO_DATA"),1=1,"NO_DATA"), status=case(sample_state="NO_DATA","NO_DATA",metric_id="ingestion.late_datasets" AND metric_value>0,"ACTION",metric_id="scheduler.success_pct" AND metric_value<95,"ACTION",metric_id="scheduler.success_pct" AND metric_value<99,"WATCH",metric_id="scheduler.skipped" AND metric_value>0,"ACTION",metric_id="queues.peak_fill_pct" AND metric_value>=90,"ACTION",metric_id="queues.peak_fill_pct" AND metric_value>=75,"WATCH",1=1,"GREEN") | eval report_key=report_family.":".strftime(period_start,"%Y-%m-%d").":".metric_id, _key=sha256(report_key), metric_value=tonumber(metric_value) | fields _key schema_version report_key report_family period_start period_end generated_at metric_id metric_value metric_unit status sample_state threshold_profile | outputlookup append=true key_field=_key mco_cim_periodic_history

