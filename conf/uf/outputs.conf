# Universal Forwarder reference. The reserved FQDNs must be replaced by names
# present in the receiver certificates. Never replace them with an IP address
# or weaken certificate and hostname validation.

[tcpout]
defaultGroup = primary_indexers
useACK = true

[tcpout:primary_indexers]
server = idx-a.example.invalid:9997,idx-b.example.invalid:9997
useSSL = true
sslVersions = tls1.2
sslVerifyServerCert = true
sslVerifyServerName = true
sslAltNameToCheck = idx-a.example.invalid,idx-b.example.invalid
useClientSSLCompression = false
