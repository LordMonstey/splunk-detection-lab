# TLS receiver example. This project implements authenticated server TLS.
# Enabling forwarder mTLS requires a separately governed client-certificate
# lifecycle and is not implied by the clientAuth EKU required by KV Store.

[splunktcp-ssl:9997]
disabled = 0

[SSL]
serverCert = $SPLUNK_HOME/etc/auth/tls/private/server.bundle.pem
requireClientCert = false
sslVersions = tls1.2
cipherSuite = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256
ecdhCurves = secp384r1,prime256v1
useSSLCompression = false
