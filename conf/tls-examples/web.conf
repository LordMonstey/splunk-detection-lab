# Reference configuration qualified live on Splunk Enterprise 9.4.13. Requalify
# it on every target release. The leaf key must remain mode 0600.

[settings]
enableSplunkWebSSL = true
privKeyPath = $SPLUNK_HOME/etc/auth/tls/private/server.key.pem
serverCert = $SPLUNK_HOME/etc/auth/tls/public/server.chain.pem
sslVersions = tls1.2
cipherSuite = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256
ecdhCurves = secp384r1,prime256v1
allowSslCompression = false
sendStrictTransportSecurityHeader = true
includeSubDomains = false
preload = false
