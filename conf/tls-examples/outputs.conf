# DNS names are reserved examples. On the target, each receiver name must be
# present in its certificate SAN and resolve through controlled DNS. The CA
# trust store is inherited from server.conf/[sslConfig]/sslRootCAPath.

[tcpout]
defaultGroup = tls-indexers

[tcpout:tls-indexers]
server = idx-a.example.invalid:9997,idx-b.example.invalid:9997
useSSL = true
sslVersions = tls1.2
sslVerifyServerCert = true
sslVerifyServerName = true
sslAltNameToCheck = idx-a.example.invalid,idx-b.example.invalid
useClientSSLCompression = false
