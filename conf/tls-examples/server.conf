# Install on every Splunk Enterprise instance that initiates or accepts TLS.
# The RSA leaf must carry serverAuth and clientAuth so KV Store can use it.
# The bundle contains the unencrypted service key and must remain mode 0600.

[sslConfig]
enableSplunkdSSL = true
serverCert = $SPLUNK_HOME/etc/auth/tls/private/server.bundle.pem
sslRootCAPath = $SPLUNK_HOME/etc/auth/tls/public/ca.cert.pem
requireClientCert = false
sslVersions = tls1.2
sslVersionsForClient = tls1.2
sslVerifyServerCert = true
sslVerifyServerName = true
cipherSuite = ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256
ecdhCurves = secp384r1,prime256v1
